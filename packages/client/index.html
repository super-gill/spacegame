<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spacegame</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" class="hud"></div>
    <div id="target-panel" class="hud target-panel hidden"></div>
    <div id="dock-panel" class="dock-panel hidden">
      <h1 id="dock-station-name">Station</h1>
      <div class="dock-tabs" role="tablist" aria-label="Station services">
        <button id="tab-market" class="dock-tab" type="button" role="tab" aria-selected="true">Market</button>
        <button id="tab-outfitting" class="dock-tab" type="button" role="tab" aria-selected="false">Outfitting</button>
        <button id="tab-ship-mart" class="dock-tab" type="button" role="tab" aria-selected="false">Ship mart</button>
        <button id="tab-ships" class="dock-tab" type="button" role="tab" aria-selected="false">Your ships</button>
      </div>
      <div id="market-container"></div>
      <div id="outfitting-container" class="hidden"></div>
      <div id="ship-mart-container" class="hidden"></div>
      <div id="ships-container" class="hidden"></div>
      <button id="undock-button" type="button">Undock [F]</button>
      <div id="pod-block" class="pod-block hidden">
        <p id="pod-text"></p>
        <button id="claim-button" type="button" class="hidden">Claim a free Courier</button>
      </div>
    </div>
    <div id="death-panel" class="dock-panel hidden">
      <h1>Escape pod destroyed</h1>
      <p class="muted">You wake at Harbour Station: in a new escape pod if you own a ship, or in a free Meridian Courier if you own none.</p>
      <button id="respawn-button" type="button">Wake at Harbour</button>
    </div>
    <div id="toast" class="toast hidden"></div>
    <button id="controls-button" class="controls-button" type="button">Controls [F1]</button>
    <button id="menu-button" class="controls-button menu-button" type="button">Menu [F2]</button>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
