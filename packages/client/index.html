<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spacegame</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" class="hud"></div>
    <div id="target-panel" class="hud target-panel hidden"></div>
    <div id="dock-panel" class="dock-panel hidden">
      <h1 id="dock-station-name">Station</h1>
      <div id="market-container"></div>
      <button id="undock-button" type="button">Undock [F]</button>
    </div>
    <div id="death-panel" class="dock-panel hidden">
      <h1>Ship destroyed</h1>
      <p class="muted">You can take a new Sparrow at Harbour Station.</p>
      <button id="respawn-button" type="button">Respawn</button>
    </div>
    <div id="toast" class="toast hidden"></div>
    <button id="controls-button" class="controls-button" type="button">Controls [F1]</button>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
